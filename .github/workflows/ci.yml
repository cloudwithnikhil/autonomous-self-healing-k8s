
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff bandit

      - name: Ruff
        run: ruff check app aiops

      - name: Bandit
        run: bandit -q -r app aiops

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint helm/self-healing

      - name: Helm template renders
        run: helm template self-healing helm/self-healing > /dev/null

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: self-healing-api
            context: app
          - name: self-healing-aiops
            context: aiops

    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t ${{ matrix.name }}:ci ${{ matrix.context }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.name }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
