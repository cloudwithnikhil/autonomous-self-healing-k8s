---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-argocd-reader
  namespace: argocd
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-argocd-reader
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: aiops-controller
    namespace: self-healing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-argocd-reader